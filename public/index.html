<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Kindmail — read and write Gmail with a kinder tone."><title>Kindifier</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232653e8'/%3E%3Cpath d='M10 13h20v15H10zm0 0 10 9 10-9' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app"><header class="topbar"><a class="brand" href="/"><span class="brandmark">k</span>kindifier<span class="brand-dot">.</span></a><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search prepared mail" aria-label="Search loaded kinder messages"><kbd>/</kbd></div><button id="settings" class="secondary">Connection</button><span class="profile" aria-hidden="true">K</span></header>
<aside class="sidebar"><button class="compose" id="compose"><span aria-hidden="true">＋</span> Compose</button><nav aria-label="Mail folders"><button class="nav-item active" data-folder="inbox"><span data-icon="inbox"></span> Inbox</button><button class="nav-item" data-folder="starred"><span data-icon="star"></span> Starred</button><button class="nav-item" data-folder="drafts"><span data-icon="file"></span> Kindmail drafts</button><button class="nav-item" data-folder="archive"><span data-icon="archive"></span> Archive</button></nav><div class="sidebar-note"><span class="little-flower">✳</span><h3>A little more kindness.</h3><p>The message stays.<br>The sharp edges don’t have to.</p></div><div class="demo-info"><span id="account-label">Checking connection…</span><p id="account-hint">Originals stay hidden.</p></div></aside>
<main class="workspace"><section class="mail-list" aria-label="Message list"><div class="list-heading"><div><h1 id="folder-title">Inbox</h1><p id="list-summary">Kind versions first.</p></div><button id="refresh" class="icon-button" aria-label="Refresh inbox">↻</button></div><div class="list-tabs"><button id="all-tab" class="selected">All loaded mail</button><button id="attention-tab">Waiting</button></div><div id="messages"></div><button id="load-more" class="secondary" hidden>Load more</button><div class="list-footer" id="list-footer">Subjects and previews stay hidden until prepared.</div></section><section id="reader" class="reader" aria-label="Read message"><div class="empty">Checking your connection…</div></section></main></div>
<dialog id="confirmation"><form method="dialog"><h2 id="confirmation-title">Review before sending</h2><div id="confirmation-content"></div><div class="reply-actions"><button value="cancel" class="secondary">Keep editing</button><button id="confirm-send" value="send" class="primary">Send this email</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="/app.js"></script></body></html>
